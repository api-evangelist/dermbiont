aid: dermbiont
name: DermBiont
description: 'DermBiont, Inc. is a Boston, Massachusetts clinical-stage dermatology
  therapeutics company founded in 2017 that develops targeted topical treatments addressing
  the root cause of skin disease rather than its symptoms. Its lead program SM-030
  is a first-in-class topical PKC-beta inhibitor in development for melasma and other
  hyperpigmentation disorders of the skin, targeting excess melanin production; earlier
  programs included SM-020 for seborrheic keratosis and the live-bacterial DBI-001
  and DBI-002 candidates for atopic dermatitis, tinea pedis and onychomycosis. The
  company describes an in-house discovery platform for microbiome-based therapeutics
  built on terabytes of DNA sequencing data from human skin samples across healthy
  individuals and patients, paired with a proprietary computational biology platform
  that identifies functions gained and lost by the skin microbiome. That computational
  platform is internal research tooling, not a product: DermBiont sells drug candidates
  and partnering opportunities, publishes no developer program, no public API, no SDK
  and no machine-readable API contract of any kind, and its website is a Squarespace-hosted
  corporate site.'
